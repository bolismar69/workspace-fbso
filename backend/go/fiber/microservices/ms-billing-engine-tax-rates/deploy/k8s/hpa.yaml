# path: backend/go/fiber/microservices/ms-billing-engine-tax-rates/deploy/k8s/hpa.yaml
# HorizontalPodAutoscaler para ms-billing-engine-tax-rates (GAP-010)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ms-tax-rates-hpa
  namespace: tax-engine
  labels:
    app: ms-tax-rates
    component: billing-engine
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ms-tax-rates
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
