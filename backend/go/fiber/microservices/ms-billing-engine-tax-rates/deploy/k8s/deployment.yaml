# path: backend/go/fiber/microservices/ms-billing-engine-tax-rates/deploy/k8s/deployment.yaml
# Deployment para ms-billing-engine-tax-rates (GAP-010)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-tax-rates
  namespace: tax-engine
  labels:
    app: ms-tax-rates
    component: billing-engine
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ms-tax-rates
  template:
    metadata:
      labels:
        app: ms-tax-rates
        component: billing-engine
    spec:
      containers:
        - name: ms-tax-rates
          image: ms-tax-rates:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: ms-tax-rates-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ms-tax-rates-secrets
                  key: database-url
                  optional: false
            - name: REDIS_ADDR
              valueFrom:
                secretKeyRef:
                  name: ms-tax-rates-secrets
                  key: redis-addr
                  optional: false
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /v1/healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /v1/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
      terminationGracePeriodSeconds: 30
