spring:
  application:
    name: spring-batch-geolocalidade

  sql:
    init:
      # Garante que o schema exista antes de Hibernate/Spring Batch criarem tabelas.
      mode: ${SPRING_SQL_INIT_MODE:always}
      schema-locations: classpath:db/init-postgres.sql

  # Configuração do Banco de Dados (PostgreSQL)
  datasource:
    # currentSchema define o schema padrão da conexão.
    # - Spring Batch cria suas tabelas METADATA no schema padrão (aqui: spring_batch)
    # - Tabelas de negócio são criadas/consultadas via hibernate.default_schema=localidade
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/worker_db?currentSchema=spring_batch}
    username: ${SPRING_DATASOURCE_USERNAME:worker_user}
    password: ${SPRING_DATASOURCE_PASSWORD:worker_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      schema: ${SPRING_DATASOURCE_SCHEMA:spring_batch}

  jpa:
    hibernate:
      # Em ambientes gerenciados, prefira migrations (Flyway/Liquibase) + validate.
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        default_schema: ${SPRING_JPA_SCHEMA:localidade}
        jdbc:
          batch_size: 100
        order_inserts: true

  # Configurações do Spring Batch
  batch:
    job:
      enabled: false # Impede que o Job rode no startup. Você o dispara via Scheduler ou Endpoint.
    jdbc:
      initialize-schema: always # Cria as tabelas internas do Batch (JOB_INSTANCE, etc)

# Variáveis customizadas da aplicação
app:
  import:
    path: ${APP_IMPORT_PATH:/tmp/work/data/ibge} # Caminho definido para o teste de carga local
    files:
      municipios: ${APP_IMPORT_PATH_DTB_MUNICIPIOS:DTB_Municipios.csv}
      distritos: ${APP_IMPORT_PATH_DTB_DISTRITOS:DTB_Distritos.csv}
      subdistritos: ${APP_IMPORT_PATH_DTB_SUBDISTRITOS:DTB_Subdistritos.csv}

# Configurações de Log (opcional para debug de performance)
logging:
  level:
    org.springframework.batch: INFO
    org.hibernate.SQL: ERROR
