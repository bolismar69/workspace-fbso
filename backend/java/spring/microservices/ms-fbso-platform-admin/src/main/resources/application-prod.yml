# =============================================================================
# Profile: prod — Produção
# =============================================================================
spring:
  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}

  flyway:
    clean-disabled: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health  # apenas health em produção

logging:
  level:
    root: WARN
    com.fbso.platform.admin: WARN
