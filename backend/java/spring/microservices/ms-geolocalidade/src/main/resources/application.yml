server:
  port: 8080

spring:
  application:
    name: ms-geolocalidade

  h2:
    console:
      enabled: true
      path: /h2-console

  # default: dev-friendly in-memory DB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:geodb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_DDL_AUTO:update}
    open-in-view: false

logging:
  pattern:
    level: "%5p [req:%X{requestId}]"
  level:
    root: INFO
    org.springframework: WARN
    com.fbso: DEBUG

awesomeapi:
  token: ${AWESOME_API_TOKEN:}
  key: ${AWESOME_API_KEY:}
  base-url: ${AWESOME_API_BASE_URL:https://cep.awesomeapi.com.br}

cache:
  awesome-cep:
    ttl-seconds: ${AWESOME_CEP_CACHE_TTL_SECONDS:86400}
    max-size: ${AWESOME_CEP_CACHE_MAX_SIZE:10000}
