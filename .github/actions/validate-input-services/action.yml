name: Validate input services
description: Validate workflow_dispatch/workflow_call services payload layout and output solutions/paths (paths-only).
author: FBSO

inputs:
  services:
    description: JSON array string in the official format [{"path":"..."}]
    required: true
  stack:
    description: Optional expected stack prefix (backend|frontend|orchestration)
    required: false
  strict:
    description: Compatibility flag (currently ignored by script)
    required: false
    default: 'false'
  python-version:
    description: Python version to use
    required: false
    default: '3.11'
  skip-checkout:
    description: If true, assumes repository is already checked out
    required: false
    default: 'false'

outputs:
  solutions:
    description: JSON array string of objects {path}
    value: ${{ steps.emit.outputs.solutions }}
  paths:
    description: JSON array string of paths
    value: ${{ steps.emit.outputs.paths }}

runs:
  using: composite
  steps:
    - name: Checkout
      if: ${{ inputs.skip-checkout != 'true' }}
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Validate input services
      id: emit
      shell: bash
      env:
        INPUT_SERVICES: ${{ inputs.services }}
        INPUT_STACK: ${{ inputs.stack }}
        INPUT_STRICT: ${{ inputs.strict }}
      run: |
        set -euo pipefail
        python3 .github/scripts/validate_input_services.py
