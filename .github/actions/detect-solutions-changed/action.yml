name: Detect solutions changed
description: Detect modified solutions between two SHAs and output solutions/paths (paths-only).
author: FBSO

inputs:
  stack:
    description: Optional stack filter (backend|frontend|orchestration)
    required: false
  base_sha:
    description: Base commit SHA for git diff
    required: false
  head_sha:
    description: Head commit SHA for git diff
    required: false
  python-version:
    description: Python version to use
    required: false
    default: '3.11'
  skip-checkout:
    description: If true, assumes repository is already checked out
    required: false
    default: 'false'

outputs:
  solutions:
    description: JSON array string of objects {path}
    value: ${{ steps.emit.outputs.solutions }}
  paths:
    description: JSON array string of paths
    value: ${{ steps.emit.outputs.paths }}

runs:
  using: composite
  steps:
    - name: Checkout
      if: ${{ inputs.skip-checkout != 'true' }}
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Detect solutions changed
      id: emit
      shell: bash
      env:
        INPUT_BASE_SHA: ${{ inputs.base_sha }}
        INPUT_HEAD_SHA: ${{ inputs.head_sha }}
        INPUT_STACK: ${{ inputs.stack }}
      run: |
        set -euo pipefail
        python3 .github/scripts/detect_solutions_changed.py
