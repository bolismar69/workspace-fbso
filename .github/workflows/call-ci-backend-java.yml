name: Call CI Backend Java

# FUNÇÃO
# - Workflow especialista (backend/java).
# - Neste estágio inicial, apenas valida e imprime o payload recebido.
# - Evolução futura: executar testes/build (Maven/Gradle), análise, build/push Docker, etc.
#
# INPUTS (workflow_call)
# - services: JSON array string com solutions (itens do inventory, incluindo specification).
#
# OUTPUTS
# - Nenhum.
on:
  workflow_call:
    inputs:
      services:
        description: 'JSON array string de solutions (somente backend/java/*).'
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
      SONAR_TOKEN:
        required: false
      NVD_API_KEY:
        required: false

permissions:
  contents: read

jobs:
  prepare-dependency-check-db:
    name: Prepare OWASP Dependency-Check DB (NVD)
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(vars.JOB_CI_TIMEOUT_OWASP_MINUTES || '20') }}
    outputs:
      java_distribution: ${{ steps.resolve-java.outputs.distribution }}
      java_version: ${{ steps.resolve-java.outputs.java_version }}
      has_db: ${{ steps.update-only.outputs.has_db }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Java toolchain (from inputs.services[0])
        id: resolve-java
        uses: actions/github-script@v7
        env:
          SERVICES_JSON: ${{ inputs.services }}
        with:
          script: |
            let services;
            try {
              services = JSON.parse((process.env.SERVICES_JSON ?? '[]').toString());
            } catch {
              core.setFailed('inputs.services não é JSON válido');
              return;
            }
            const first = Array.isArray(services) ? services[0] : null;
            const distribution = (first?.specification?.platformDistributor ?? 'temurin').toString();
            const javaVersion = (first?.specification?.platformVersion ?? '21').toString();
            core.setOutput('distribution', distribution);
            core.setOutput('java_version', javaVersion);

      - name: Resolve first service path (from inputs.services[0])
        id: resolve-service
        uses: actions/github-script@v7
        env:
          SERVICES_JSON: ${{ inputs.services }}
        with:
          script: |
            let services;
            try {
              services = JSON.parse((process.env.SERVICES_JSON ?? '[]').toString());
            } catch {
              core.setFailed('inputs.services não é JSON válido');
              return;
            }
            const first = Array.isArray(services) ? services[0] : null;
            const path = (first?.path ?? '').toString().trim();
            if (!path) {
              core.setFailed('inputs.services[0].path vazio; não é possível preparar a DB');
              return;
            }
            core.setOutput('service_path', path);

      - name: Setup Java (for dependency-check:update-only)
        uses: actions/setup-java@v4
        with:
          distribution: ${{ steps.resolve-java.outputs.distribution }}
          java-version: ${{ steps.resolve-java.outputs.java_version }}
          cache: maven

      - name: Diagnóstico (NVD_API_KEY presente?)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${NVD_API_KEY:-}" ]; then
            echo "OK: NVD_API_KEY está configurado (valor oculto)."
          else
            echo "WARN: NVD_API_KEY está vazio/não disponível neste run."
          fi

      - name: Compute Dependency-Check cache key (weekly)
        id: dc-cache-key
        shell: bash
        run: |
          set -euo pipefail
          echo "key=${{ runner.os }}-dependency-check-db-v1-$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
          echo "restore_prefix=${{ runner.os }}-dependency-check-db-v1-" >> "$GITHUB_OUTPUT"

      - name: Cache Dependency-Check DB (shared)
        uses: actions/cache@v4
        with:
          path: ~/.dependency-check
          key: ${{ steps.dc-cache-key.outputs.key }}
          restore-keys: |
            ${{ steps.dc-cache-key.outputs.restore_prefix }}

      - name: Update-only (download NVD once)
        id: update-only
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          SERVICE_PATH: ${{ steps.resolve-service.outputs.service_path }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.dependency-check"

          if [ -z "${NVD_API_KEY:-}" ]; then
            echo "NVD_API_KEY (secret) não configurado; pulando update-only." >&2
            echo "has_db=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Executa o plugin dentro de um serviço real (onde o plugin está declarado/herdado)
          cd "$SERVICE_PATH"

          for i in 1 2 3; do
            echo "dependency-check:update-only attempt=$i"
            if [ -x ./mvnw ]; then
              ./mvnw -B -U org.owasp:dependency-check-maven:update-only \
                -DnvdApiKey="$NVD_API_KEY" -Dodc.nvdApiKey="$NVD_API_KEY" \
                -DdataDirectory="$HOME/.dependency-check" -Dodc.dataDirectory="$HOME/.dependency-check" && break
            else
              mvn -B -U org.owasp:dependency-check-maven:update-only \
                -DnvdApiKey="$NVD_API_KEY" -Dodc.nvdApiKey="$NVD_API_KEY" \
                -DdataDirectory="$HOME/.dependency-check" -Dodc.dataDirectory="$HOME/.dependency-check" && break
            fi
            sleep $((i * 20))
          done

          # Sanity-check: garante que existe conteúdo após o update
          if [ ! -d "$HOME/.dependency-check" ] || [ -z "$(ls -A "$HOME/.dependency-check" 2>/dev/null)" ]; then
            echo "Dependency-Check DB vazia após update-only" >&2
            exit 1
          fi

          echo "has_db=true" >> "$GITHUB_OUTPUT"

      - name: Upload Dependency-Check DB artifact
        if: steps.update-only.outputs.has_db == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-db
          path: ~/.dependency-check
          if-no-files-found: error
          retention-days: 1

  call-ci-java:
    name: Call CI Backend Java
    runs-on: ubuntu-latest
    needs: [prepare-dependency-check-db]
    if: always()
    timeout-minutes: ${{ fromJSON(vars.JOB_CI_TIMEOUT_MINUTES || '60') }}
    env:
      # === Docker (GitHub Variables) ===
      DOCKER_PORT_TO_EXPOSE: ${{ vars.DOCKER_PORT_TO_EXPOSE }}
      DOCKER_APP_OUTPUT_PATH: ${{ vars.DOCKER_APP_OUTPUT_PATH }}
      DOCKER_APP_USER: ${{ vars.DOCKER_APP_USER }}
      DOCKER_TAG_PREFIX: ${{ vars.DOCKER_TAG_PREFIX }}
      DOCKER_REGISTRY: ${{ vars.DOCKER_REGISTRY }}
      DOCKER_ORG: ${{ vars.DOCKER_ORG }}

      # === Docker Java (GitHub Variables) ===
      DOCKER_JAVA_IMAGE_TO_BUILD_STANDARD: ${{ vars.DOCKER_JAVA_IMAGE_TO_BUILD_STANDARD }}
      DOCKER_JAVA_IMAGE_TO_BUILD_SPRING: ${{ vars.DOCKER_JAVA_IMAGE_TO_BUILD_SPRING }}
      DOCKER_JAVA_IMAGE_TO_BUILD_QUARKUS: ${{ vars.DOCKER_JAVA_IMAGE_TO_BUILD_QUARKUS }}
      DOCKER_JAVA_IMAGE_TO_RUNTIME_JVM: ${{ vars.DOCKER_JAVA_IMAGE_TO_RUNTIME_JVM }}
      DOCKER_JAVA_IMAGE_TO_RUNTIME_NATIVE: ${{ vars.DOCKER_JAVA_IMAGE_TO_RUNTIME_NATIVE }}
      DOCKER_JAVA_ARGS: ${{ vars.DOCKER_JAVA_ARGS }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.services) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Definir variáveis derivadas (Docker)
        shell: bash
        run: |
          set -euo pipefail
          echo "GITHUB_SHA_SHORT=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "DOCKER_TAG_SUFFIX=-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: ${{ matrix.specification.platformDistributor }}
          java-version: ${{ matrix.specification.platformVersion }}
          cache: maven
          cache-dependency-path: |
            ${{ matrix.path }}/pom.xml
            ${{ matrix.path }}/**/pom.xml
            ${{ matrix.path }}/mvnw
            ${{ matrix.path }}/.mvn/maven.config
            ${{ matrix.path }}/.mvn/wrapper/maven-wrapper.properties
            ${{ matrix.path }}/.mvn/wrapper/maven-wrapper.jar

      - name: Download Dependency-Check DB artifact
        if: needs.prepare-dependency-check-db.result == 'success' && needs.prepare-dependency-check-db.outputs.has_db == 'true'
        uses: actions/download-artifact@v4
        with:
          name: dependency-check-db
          path: ~/.dependency-check

      - name: Verificação Checkstyle
        # if: ${{ startsWith(matrix.path, 'backend/java/spring/') }}
        run: |
          set -euo pipefail
          cd ${{ matrix.path }}
          if [ -x ./mvnw ]; then
            ./mvnw -B -U -DskipTests checkstyle:check
          else
            mvn -B -U -DskipTests checkstyle:check
          fi
      # TODO: extrair lógica de análise Checkstyle para ação reutilizável, consumida por este e outros workflows (ex: CI Genérico Frontend)

      - name: OWASP Dependency Analysis
        timeout-minutes: ${{ fromJSON(vars.JOB_CI_TIMEOUT_OWASP_MINUTES || '20') }}
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${NVD_API_KEY:-}" ]; then
            echo "NVD_API_KEY (secret) não configurado; pulando OWASP Dependency-Check." >&2
            exit 0
          fi

          if [ ! -d "$HOME/.dependency-check" ] || [ -z "$(ls -A "$HOME/.dependency-check" 2>/dev/null)" ]; then
            echo "Dependency-Check DB não disponível. O job preparatório não gerou/forneceu a DB." >&2
            exit 1
          fi

          cd ${{ matrix.path }}
          if [ -x ./mvnw ]; then
            ./mvnw org.owasp:dependency-check-maven:check -B -DskipTests -Dcheckstyle.skip=true \
              -DdataDirectory="$HOME/.dependency-check" -Dodc.dataDirectory="$HOME/.dependency-check" \
              -DautoUpdate=false -Dodc.autoUpdate=false \
              -DnvdApiKey="$NVD_API_KEY" -Dodc.nvdApiKey="$NVD_API_KEY"
          else
            mvn org.owasp:dependency-check-maven:check -B -DskipTests -Dcheckstyle.skip=true \
              -DdataDirectory="$HOME/.dependency-check" -Dodc.dataDirectory="$HOME/.dependency-check" \
              -DautoUpdate=false -Dodc.autoUpdate=false \
              -DnvdApiKey="$NVD_API_KEY" -Dodc.nvdApiKey="$NVD_API_KEY"
          fi

      - name: Upload OWASP Report
        uses: actions/upload-artifact@v4
        if: always() # Garante que o relatório suba mesmo se encontrar falhas
        with:
          name: owasp-report-${{ matrix.name }}
          path: ${{ matrix.path }}/target/dependency-check-report.html

      # TODO: extrair lógica de análise de vulnerabilidades para ação reutilizável, consumida por este e outros workflows (ex: CI Genérico Frontend)
      # - name: Análise de vulnerabilidades com Snyk
      #   if: ${{ secrets.SNYK_TOKEN }}
      #   env:
      #     SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      #   run: |
      #     set -euo pipefail
      #     cd ${{ matrix.path }}
      #     if [ -f "pom.xml" ]; then
      #       snyk test --all-projects --severity-threshold=high
      #     else
      #       echo "pom.xml não encontrado em ${{ matrix.path }}; pulando Snyk." >&2
      #       exit 0
      #     fi

      - name: Build do serviço com Maven (usa mvnm quando disponivel)
        run: |
          set -euo pipefail
          cd ${{ matrix.path }}
          if [ -x ./mvnw ]; then
            ./mvnw clean install -DskipTests -B -Ddependency-check.skip=true
          else
            mvn clean install -DskipTests -B -Ddependency-check.skip=true
          fi

      - name: Run Unit Tests
        run: |
          set -euo pipefail
          cd ${{ matrix.path }}
          if [ -x ./mvnw ]; then
            ./mvnw test -B
          else
            mvn test -B
          fi
      # TODO: extrair lógica de execução de testes para ação reutilizável, consumida por este e outros workflows (ex: CI Genérico Frontend)

      - name: Verificação SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${SONAR_TOKEN:-}" ]; then
            echo "SONAR_TOKEN (secret) não configurado; pulando SonarQube." >&2
            exit 0
          fi

          cd ${{ matrix.path }}

          # O sonar.projectKey não pode conter '/'
          SONAR_PROJECT_KEY="bolismar69:${{ matrix.path }}"
          SONAR_PROJECT_KEY="${SONAR_PROJECT_KEY//\//_}"

          if [ -x ./mvnw ]; then
            ./mvnw -B -U -DskipTests -Ddependency-check.skip=true org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
              -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
              -Dsonar.host.url=https://sonarcloud.io \
              -Dsonar.organization=bolismar69 \
              -Dsonar.login="$SONAR_TOKEN"
          else
            mvn -B -U -DskipTests -Ddependency-check.skip=true org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
              -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
              -Dsonar.host.url=https://sonarcloud.io \
              -Dsonar.organization=bolismar69 \
              -Dsonar.login="$SONAR_TOKEN"
          fi
      # TODO: extrair lógica de análise SonarQube para ação reutilizável, consumida por este e outros workflows (ex: CI Genérico Frontend)

      - name: Validar artefato gerado
        id: validate-artifact
        run: |
          set -euo pipefail
          cd ${{ matrix.path }}
          if compgen -G "target/*.jar" > /dev/null; then
            echo "OK - artifact JAR encontrado"
          elif [ -d target ] && [ "$(ls -A target)" ]; then
            echo "OK - diretório target contém arquivos"
          else
            echo "Artifact ausente em ${{ matrix.path }}" >&2
            ls -la || true
            exit 1
          fi

      # PROCESSO DE RELEASE - CRIACAO DE IMAGEM DO SERVICO COM DOCKER
      - name: Hadolint no Dockerfile
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: ${{ matrix.specification.docker.dockerfile }} 
          # fail-level: error
          verbose: true
      # TODO: logar e extrair lógica de build/push Docker para ação reutilizável, consumida por este e outros workflows (ex: CI Genérico Frontend)

      - name: Preparar Docker Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@v2

      - name: Login no registry Docker
        id: docker-login
        uses: docker/login-action@v2
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Definir IMAGE_NAME e IMAGE_TAG
        id: define-image-e-tag
        uses: actions/github-script@v7
        env:
          IMAGE_NAME: ${{ matrix.name }}
          DOCKER_REGISTRY: ${{ env.DOCKER_REGISTRY }}
          DOCKER_ORG: ${{ env.DOCKER_ORG }}
          DOCKER_TAG_PREFIX: ${{ env.DOCKER_TAG_PREFIX }}
          GITHUB_SHA: ${{ github.sha }}
        with:
          script: |
            const imageName = (process.env.IMAGE_NAME ?? '').toString();
            if (!imageName) throw new Error('IMAGE_NAME vazio');

            const registry = (process.env.DOCKER_REGISTRY ?? '').toString();
            const org = (process.env.DOCKER_ORG ?? '').toString();
            const prefix = (process.env.DOCKER_TAG_PREFIX ?? 'ci').toString();
            const shaFull = (process.env.GITHUB_SHA ?? context.sha).toString();
            const shaShort = shaFull.slice(0, 7);
            const datahoraformatoYYYYMMDDHHMMSS = () => {
              const now = new Date();
              const YYYY = now.getUTCFullYear().toString().padStart(4, '0');
              const MM = (now.getUTCMonth() + 1).toString().padStart(2, '0');
              const DD = now.getUTCDate().toString().padStart(2, '0');
              const HH = now.getUTCHours().toString().padStart(2, '0');
              const mm = now.getUTCMinutes().toString().padStart(2, '0');
              const ss = now.getUTCSeconds().toString().padStart(2, '0');
              return `${YYYY}${MM}${DD}${HH}${mm}${ss}`;
            };

            if (!registry || !org) {
              throw new Error('DOCKER_REGISTRY/DOCKER_ORG não definidos');
            }

            const imageTag = `${registry}/${org}/${imageName}:${prefix}-${datahoraformatoYYYYMMDDHHMMSS()}-${shaShort}`;
            core.exportVariable('IMAGE_TAG', imageTag);
            core.setOutput('image_tag', imageTag);

      - name: Build & Push com build-push-action
        id: build-push
        uses: docker/build-push-action@v4
        timeout-minutes: ${{ fromJSON(vars.JOB_CI_TIMEOUT_DOCKER_BUILD_PUSH_MINUTES || '25') }}
        with:
          context: .
          # steps.resolve_blueprint.outputs.dockerfile -- ANTIGA VARIAVEL DE PATH DO DOCKERFILE
          file: ${{ matrix.specification.docker.dockerfile }}
          push: true
          tags: ${{ steps['define-image-e-tag'].outputs.image_tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            SERVICE_PATH=${{ matrix.path }}
            JAVA_VERSION=${{ matrix.specification.platformVersion }}
            IMAGE_TO_BUILD=${{ matrix.specification.docker.argImageBuild }}
            IMAGE_TO_RUNTIME=${{ matrix.specification.docker.argImageRuntime }}
            APP_PORT=${{ matrix.specification.docker.argExposePort }}
            CMD_EXTRA_BUILDER_PRE_COPY=${{ matrix.specification.docker.argCmdExtraBuilderPreCopy }}
            CMD_EXTRA_BUILDER_POS_COMPILE=${{ matrix.specification.docker.argCmdExtraBuilderPosCompile }}
            CMD_EXTRA_RUNTIME_PRE_COPY=${{ matrix.specification.docker.argCmdExtraRuntimePreCopy }}
            CMD_EXTRA_RUNTIME_PRE_CMD=${{ matrix.specification.docker.argCmdExtraRuntimePreCmd }}
            COMPILATION_MODE=${{ matrix.specification.docker.argCompilationMode }}

      - name: Execucao analise da imagem gerada com Trivy
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ steps['define-image-e-tag'].outputs.image_tag }}
          scan-type: 'vuln,config,image'
          format: 'sarif'
          # format: 'table'
          output: 'trivy-docker-report.txt'
          severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
          # ignore-unfixed: true
          # vuln-type: 'os,library'
          # fail-on: 'HIGH,CRITICAL'
          # scan-referrer: true
          # scan-build-info: true
          # scan-diff: true
          # scan-removed-packages: true
          # show-progress: true
          # exit-code: '1'
      
      - name: Upload Trivy report to GitHub
        uses: github/codeql-action/upload-sarif@v2
        with:
          category: docker-results
          sarif_file: 'trivy-docker-report.txt'
