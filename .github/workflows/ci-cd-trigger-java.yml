name: CI/CD Trigger Java

# FUNÇÃO
# - Detecta changes em services Java no monorepo.
# - Chama o reusable detector para descobrir solutions alteradas.
# - (Opcional) Valida `input.services` (workflow_dispatch) via inventory e enriquece o payload.
# - Valida/enrijece o contrato do inventory e prepara uma matrix de build.
# - Chama o reusable build para executar Maven + Docker build/push.
#
# INPUTS (workflow_dispatch)
# - services (opcional): string contendo JSON array para sobrescrever a detecção automática.
#   Formato recomendado (apenas paths; o workflow enriquece via inventory):
#   ["backend/java/spring/microservices/ms-example"]
#   ou
#   [{"path":"backend/java/spring/microservices/ms-example"}]
#
# OBS
# - O schema oficial do inventory é `solutions[]` com `specification{...}`.
# - Os passos de build ainda consomem campos achatados (ex.: platformVersion/platformDistributor/docker) derivados de `specification.*`.
#
# OUTPUTS (interno)
# - prepare_services.outputs.matrix: string com JSON array no formato aceito pelo build reusable.
#   Exemplo:
#   [
#     {
#       "path": "backend/java/spring/microservices/ms-example",
#       "goals": "clean install",
#       "platformVersion": "21",
#       "platformDistributor": "temurin",
#       "docker": { "argCompilationMode": "jvm" }
#     }
#   ]
#
# OBS (governança)
# - Se uma solution detectada estiver sem algum atributo obrigatório do inventory
#   (ex.: platformVersion/platformDistributor/etc), o job `prepare_services` loga WARNING
#   com prefixo `[inventory-incomplete]` e NÃO inclui a solution na matrix.
#
# STEPS (resumo)
# - detect_solutions: detecta solutions alteradas por diff (push/PR) e valida existência no inventory.
# - validate_input_services: valida/enriquece o override (workflow_dispatch) via inventory.
# - prepare_services: filtra apenas Java backend e produz matrix para build.
# - build_matrix: chama o reusable de build Java em matrix.

on:
  # push:
  #   branches: [ main ]
  #   paths:
  #     - 'backend/java/**'
  # pull_request:
  #   branches: [ main ]
  #   paths:
  #     - 'backend/java/**'
  workflow_dispatch:
    inputs:
      services:
        description: 'Opcional: JSON array (recomendado: paths) para sobrescrever a detecção automática. Ex.: ["backend/java/spring/microservices/ms-example"]'
        required: false

permissions:
  contents: read
  pull-requests: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect_solutions:
    name: Detectar solutions alteradas (monorepo)
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    uses: ./.github/workflows/global-callables-detection-solutions-changed.yml
    with:
      base_sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      head_sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

  validate_input_services:
    name: Validar input.services (workflow_dispatch)
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.services && github.event.inputs.services != 'null' && github.event.inputs.services != '[]' }}
    uses: ./.github/workflows/global-callables-validate-input-services.yml
    with:
      stack: backend
      services: ${{ github.event.inputs.services }}
      strict: 'true'

  prepare_services:
    name: Preparar matrix de serviços Java
    runs-on: ubuntu-latest
    needs: [detect_solutions, validate_input_services]
    if: ${{ always() }}
    outputs:
      matrix: ${{ steps.out.outputs.matrix }}
    steps:
      - name: Preparar lista de serviços para build
        id: out
        uses: actions/github-script@v7
        env:
          SOLUTIONS_JSON: >-
            ${{
              (needs.validate_input_services.result == 'success' && needs.validate_input_services.outputs.solutions)
              || (needs.detect_solutions.result == 'success' && needs.detect_solutions.outputs.solutions)
              || '[]'
            }}
          ORIGIN_LABEL: ${{ needs.validate_input_services.result == 'success' && 'override' || 'detector' }}
        with:
          script: |
            const originLabel = (process.env.ORIGIN_LABEL ?? 'detector').toString();

            const isNullishOrEmptyString = (v) =>
              v === null || v === undefined || (typeof v === 'string' && v.trim() === '');
            const solutionsRaw = (process.env.SOLUTIONS_JSON ?? '').toString().trim() || '[]';
            let solutions = [];
            try {
              solutions = JSON.parse(solutionsRaw);
            } catch (err) {
              core.warning('Falha ao parsear SOLUTIONS_JSON; assumindo []');
              solutions = [];
            }

            const getSpec = (s) => (s?.specification && typeof s.specification === 'object') ? s.specification : null;
            const getPlatformVersion = (s) => {
              const spec = getSpec(s);
              return (spec?.platformVersion ?? s?.platformVersion ?? '').toString().trim();
            };
            const getPlatformDistributor = (s) => {
              const spec = getSpec(s);
              return (spec?.platformDistributor ?? s?.platformDistributor ?? '').toString().trim();
            };
            const getDocker = (s) => {
              const spec = getSpec(s);
              return (spec?.docker ?? s?.docker ?? null);
            };

            const toJavaServiceMatrixEntry = (s) => ({
              path: s.path,
              goals: ' -B -U verify -Ddependency-check.skip=true',
              platformVersion: getPlatformVersion(s),
              platformDistributor: getPlatformDistributor(s),
              docker: getDocker(s),
            });

            const validateBuildRequirements = (s, originLabel) => {
              const pathLabel = (s?.path ?? '<sem path>').toString();
              const missing = [];

              // Inventory base
              for (const k of ['stack','platform','framework','type','name','status','path']) {
                if (isNullishOrEmptyString(s?.[k])) missing.push(k);
              }

              // Build requirements (derivados de specification.*)
              if (isNullishOrEmptyString(getPlatformVersion(s))) missing.push('specification.platformVersion');
              if (isNullishOrEmptyString(getPlatformDistributor(s))) missing.push('specification.platformDistributor');

              const docker = getDocker(s);
              if (docker === null || docker === undefined || isNullishOrEmptyString(docker?.argCompilationMode)) {
                missing.push('specification.docker.argCompilationMode');
              }

              if (missing.length > 0) {
                core.warning(
                  `[inventory-incomplete] (${originLabel}) Solution '${pathLabel}' com inventory/specification incompleto. Faltando/NULL: ${missing.join(', ')}`
                );
                return false;
              }
              return true;
            };

            const services = [];
            for (const s of (Array.isArray(solutions) ? solutions : [])) {
              // Segundo: filtrar apenas Java backend
              if (s.stack !== 'backend' || s.platform !== 'java') continue;

              // Terceiro: validar requisitos de build
              if (!validateBuildRequirements(s, originLabel)) {
                continue;
              }

              services.push(toJavaServiceMatrixEntry(s));
            }

            core.info(`Serviços Java preparados: ${services.length}`);
            const listServices = services
              .map(s => `- ${s.path} (Java ${s.platformDistributor} ${s.platformVersion}, goals: ${s.goals})`)
              .join('\n');
            core.info(`Lista de serviços:\n${listServices}`);

            core.setOutput('matrix', JSON.stringify(services));

  build_matrix:
    name: Build dos serviços Java
    needs: prepare_services
    if: ${{ needs.prepare_services.outputs.matrix != '[]' && needs.prepare_services.outputs.matrix != '' }}
    uses: ./.github/workflows/global-callables-java-build-solutions.yml
    with:
      services: ${{ needs.prepare_services.outputs.matrix }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
