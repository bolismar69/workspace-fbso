name: Trigger CI Generic

# FUNÇÃO
# - Entry-point genérico de CI/CD do monorepo.
# - Executa 2 etapas base:
#   1) detectar alterações ocorridas no monorepo
#   2) validar/enrijecer inventory e identificar as solutions afetadas
# - Deriva para workflows específicos por domínio (backend/frontend/orchestration)
#   com base no prefixo do `path` do inventory.
#
# INPUTS (workflow_dispatch)
# - services (opcional): sobrescreve a detecção automática.
#   Formato recomendado (apenas paths; o workflow enriquece via inventory):
#   ["backend/java/spring/queue_workers/ms-transaction-processor-queue"]
#   ou
#   [{"path":"backend/java/spring/queue_workers/ms-transaction-processor-queue"}]
#
# OBS
# - O schema oficial do inventory é `solutions[]` com `specification{...}`.
# - O payload roteado para backend/frontend/orchestration é o item do inventory (inclui specification).
#
# OUTPUTS (interno)
# - prepare_services.outputs.backend_services / frontend_services / orchestration_services
#   (JSON array string) com as solutions válidas e roteadas por prefixo.
#
# STEPS (resumo)
# - detect_solutions_generic: detecta solutions alteradas por diff (push/PR) e valida existência no inventory.
# - validate_input_services: valida/enriquece o override (workflow_dispatch) via inventory.
# - prepare_services: roteia solutions por prefixo do path (backend/frontend/orchestration).
# - ci_backend/ci_frontend/ci_orchestration: chama os workflows especialistas.

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'orchestration/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'orchestration/**'
  workflow_dispatch:
    inputs:
      services:
        description: 'Opcional: JSON array (recomendado: paths) para sobrescrever a detecção automática. Ex.: ["backend/java/spring/queue_workers/ms-transaction-processor-queue"]'
        required: false

permissions:
  contents: read
  pull-requests: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect_solutions_generic:
    name: Detectar solutions alteradas (genérico)
    uses: ./.github/workflows/global-callables-detection-solutions-changed.yml
    with:
      base_sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before || github.sha }}
      head_sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

  validate_input_services:
    name: Validar input.services (workflow_dispatch)
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.services && github.event.inputs.services != 'null' && github.event.inputs.services != '[]' }}
    uses: ./.github/workflows/global-callables-validate-input-services.yml
    with:
      services: ${{ github.event.inputs.services }}
      strict: 'true'

  prepare_services:
    name: Preparar solutions/serviços (genérico)
    runs-on: ubuntu-latest
    needs: [detect_solutions_generic, validate_input_services]
    if: ${{ always() }}
    outputs:
      backend_services: ${{ steps.out.outputs.backend_services }}
      frontend_services: ${{ steps.out.outputs.frontend_services }}
      orchestration_services: ${{ steps.out.outputs.orchestration_services }}
      services_invalid: ${{ steps.out.outputs.services_invalid }}
      inventory_warnings: ${{ steps.out.outputs.inventory_warnings }}
    steps:
      - name: Validar inventory e preparar roteamento
        id: out
        uses: actions/github-script@v7
        env:
          SOLUTIONS_JSON: >-
            ${{
              (needs.validate_input_services.result == 'success' && needs.validate_input_services.outputs.solutions)
              || (needs.detect_solutions_generic.result == 'success' && needs.detect_solutions_generic.outputs.solutions)
              || '[]'
            }}
          ORIGIN_LABEL: ${{ needs.validate_input_services.result == 'success' && 'override' || 'detector' }}
        with:
          script: |
            const solutionsRaw = (process.env.SOLUTIONS_JSON ?? '').toString().trim() || '[]';
            const originLabel = (process.env.ORIGIN_LABEL ?? 'detector').toString();

            const isNullishOrEmptyString = (v) =>
              v === null || v === undefined || (typeof v === 'string' && v.trim() === '');

            let solutions = [];
            try {
              solutions = JSON.parse(solutionsRaw);
            } catch {
              core.warning('Falha ao parsear SOLUTIONS_JSON; assumindo []');
              solutions = [];
            }
            if (!Array.isArray(solutions)) solutions = [];

            const backend = [];
            const frontend = [];
            const orchestration = [];
            const invalid = [];

            const seen = new Set();
            for (const s of solutions) {
              const p = (s?.path ?? '').toString().trim();
              if (!p) continue;

              if (seen.has(p)) continue;
              seen.add(p);

              if (p.startsWith('backend/')) backend.push(s);
              else if (p.startsWith('frontend/')) frontend.push(s);
              else if (p.startsWith('orchestration/')) orchestration.push(s);
              else {
                core.warning(`[inventory-incomplete] Solution '${p}' com prefixo de path não roteável (esperado backend|frontend|orchestration).`);
                invalid.push({ path: p, missing: ['path-prefix'] });
              }
            }

            core.info(`Solutions recebidas: ${solutions.length}`);
            core.info(`Backend: ${backend.length} | Frontend: ${frontend.length} | Orchestration: ${orchestration.length}`);
            core.info(`Inventory warnings (invalid): ${invalid.length}`);
            core.info(`Origem: ${originLabel}`);

            core.setOutput('backend_services', JSON.stringify(backend));
            core.setOutput('frontend_services', JSON.stringify(frontend));
            core.setOutput('orchestration_services', JSON.stringify(orchestration));
            core.setOutput('services_invalid', JSON.stringify(invalid));
            core.setOutput('inventory_warnings', String(invalid.length));

  ci_backend:
    name: CI Generic Backend
    needs: prepare_services
    if: ${{ needs.prepare_services.outputs.backend_services != '[]' && needs.prepare_services.outputs.backend_services != '' }}
    uses: ./.github/workflows/ci-generic-backend.yml
    with:
      services: ${{ needs.prepare_services.outputs.backend_services }}

  ci_frontend:
    name: CI Generic Frontend
    needs: prepare_services
    if: ${{ needs.prepare_services.outputs.frontend_services != '[]' && needs.prepare_services.outputs.frontend_services != '' }}
    uses: ./.github/workflows/ci-generic-frontend.yml
    with:
      services: ${{ needs.prepare_services.outputs.frontend_services }}

  ci_orchestration:
    name: CI Generic Orchestration
    needs: prepare_services
    if: ${{ needs.prepare_services.outputs.orchestration_services != '[]' && needs.prepare_services.outputs.orchestration_services != '' }}
    uses: ./.github/workflows/ci-generic-orchestration.yml
    with:
      services: ${{ needs.prepare_services.outputs.orchestration_services }}
