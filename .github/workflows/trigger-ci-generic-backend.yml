name: CI Generic Backend

# FUNÇÃO
# - Pipeline específico para backend.
# - Suporta 2 modos:
#   - push/PR: detecta alterações via reusable detector (git diff) e retorna apenas {path}.
#   - workflow_dispatch/workflow_call: valida apenas o layout de `services` (lista de {path}).
# - Validação/enriquecimento contra o inventory ocorre em job dedicado: validate_identified_solutions.
# - Roteia as solutions por plataforma (stack=backend): java/go/python/csharp.
# - Chama o workflow especialista correspondente:
#   - backend/csharp  -> call-ci-backend-csharp.yml
#   - backend/go      -> call-ci-backend-go.yml
#   - backend/python  -> call-ci-backend-python.yml
#   - backend/java    -> call-ci-backend-java.yml
# - Evolução futura: cada workflow especialista implementa build/test/lint da sua plataforma.
#
# INPUTS
# - workflow_dispatch.services: opcional (JSON array string) no formato [{"path":"..."}] para sobrescrever a detecção automática.
# - workflow_call.services: opcional (JSON array string) no formato [{"path":"..."}] para sobrescrever a detecção automática.
# - Exemplos de input.services recomendado (apenas paths; o workflow enriquece via inventory):
#   1: [{"path": "backend/java/spring/queue_workers/ms-transaction-processor-queue"}]
#   2: 
#     [
#     {"path": "backend/java/spring/queue_workers/ms-transaction-processor-queue"},
#     {"path": "frontend/javascript/react/web_apps/web-ecommerce-sales"},
#     {"path": "orchestration/kestra/flows/etl/etl-bank-files-process"}
#     ]
#
# OUTPUTS
# - Nenhum. Efeito: chama workflows especialistas conforme plataformas afetadas.

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
  workflow_dispatch:
    inputs:
      services:
        description: 'Opcional: JSON array (formato oficial) para sobrescrever a detecção automática.'
        required: false
        type: string
        default: '[{"path": "backend/java/spring/queue_workers/ms-transaction-processor-queue"},{"path": "backend/csharp/.net/queue_workers/ms-transaction-processor-queue"},{"path": "backend/go/gin/queue_workers/ms-transaction-processor-queue"},{"path": "backend/python/django/queue_workers/ms-transaction-processor-queue"},{"path": "frontend/javascript/react/web_apps/web-ecommerce-sales"},{"path": "orchestration/kestra/flows/etl/etl-bank-files-process"}]'

  workflow_call:
    inputs:
      services:
        description: 'String contendo JSON array de solutions (somente backend/*).'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect_solutions_changed:
    name: Detectar solutions alteradas (backend)
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    uses: ./.github/workflows/util-detection-solutions-changed.yml
    with:
      stack: backend
      base_sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before || github.sha }}
      head_sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

  detect_input_services:
    name: Validar input.services (workflow_dispatch/workflow_call)
    if: >-
      ${{
        (github.event_name == 'workflow_call'
          && inputs.services
          && inputs.services != 'null'
          && inputs.services != '[]'
          && contains(inputs.services, '"path"')
        )
        ||
        (github.event_name == 'workflow_dispatch'
          && github.event.inputs.services
          && github.event.inputs.services != 'null'
          && github.event.inputs.services != '[]'
          && contains(github.event.inputs.services, '"path"')
        )
      }}
    uses: ./.github/workflows/util-validate-input-services.yml
    with:
      stack: backend
      services: ${{ github.event_name == 'workflow_call' && inputs.services || github.event.inputs.services }}
      strict: 'false'

  validate_identified_solutions:
    name: Validar solutions identificadas (inventory)
    needs: [detect_solutions_changed, detect_input_services]
    if: >-
      ${{
        always()
        && ( needs.detect_input_services.result == 'success' || needs.detect_solutions_changed.result == 'success' )
      }}
    uses: ./.github/workflows/util-validate-identified-solutions.yml
    with:
      stack: backend
      services: >-
        ${{
          (needs.detect_input_services.result == 'success' && needs.detect_input_services.outputs.solutions)
          || (needs.detect_solutions_changed.result == 'success' && needs.detect_solutions_changed.outputs.solutions)
          || '[]'
        }}

  enrich_missing_specification:
    name: Preencher specification via global types (backend)
    runs-on: ubuntu-latest
    needs: validate_identified_solutions
    if: ${{ always() && needs.validate_identified_solutions.outputs.solutions != '' && needs.validate_identified_solutions.outputs.solutions != '[]' }}
    outputs:
      solutions: ${{ steps.enrich.outputs.solutions }}
      paths: ${{ steps.enrich.outputs.paths }}
    steps:
      - name: Diagnóstico (validate_identified_solutions)
        env:
          VALIDATE_RESULT: ${{ needs.validate_identified_solutions.result }}
          VALIDATE_SOLUTIONS: ${{ needs.validate_identified_solutions.outputs.solutions }}
          VALIDATE_PATHS: ${{ needs.validate_identified_solutions.outputs.paths }}
        run: |
          set -euo pipefail
          echo "needs.validate_identified_solutions.result=$VALIDATE_RESULT"
          echo "needs.validate_identified_solutions.outputs.paths=${VALIDATE_PATHS:-}"
          echo "needs.validate_identified_solutions.outputs.solutions=${VALIDATE_SOLUTIONS:-}"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Aplicar defaults de specification (por tipo)
        id: enrich
        env:
          SERVICES_JSON: ${{ needs.validate_identified_solutions.outputs.solutions || '[]' }}
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_global_types_specification.py \
            --global-types architecture/governance/config/global-types-solution.json

  route_backend_platforms:
    name: Roteamento por plataforma (backend)
    runs-on: ubuntu-latest
    needs: enrich_missing_specification
    if: ${{ always() && needs.enrich_missing_specification.outputs.solutions != '' && needs.enrich_missing_specification.outputs.solutions != '[]' }}
    outputs:
      java_services: ${{ steps.route.outputs.java_services }}
      go_services: ${{ steps.route.outputs.go_services }}
      python_services: ${{ steps.route.outputs.python_services }}
      csharp_services: ${{ steps.route.outputs.csharp_services }}
    steps:
      - name: Diagnóstico (enrich_missing_specification)
        env:
          ENRICH_SOLUTIONS: ${{ needs.enrich_missing_specification.outputs.solutions }}
          ENRICH_PATHS: ${{ needs.enrich_missing_specification.outputs.paths }}
        run: |
          set -euo pipefail
          echo "needs.enrich_missing_specification.outputs.paths=${ENRICH_PATHS:-}"
          echo "needs.enrich_missing_specification.outputs.solutions=${ENRICH_SOLUTIONS:-}"
      - name: Roteiar services por plataforma
        id: route
        uses: actions/github-script@v7
        env:
          SERVICES_JSON: ${{ needs.enrich_missing_specification.outputs.solutions || '[]' }}
        with:
          script: |
            let services;
            try {
              services = JSON.parse((process.env.SERVICES_JSON ?? '[]').toString());
            } catch {
              core.setFailed('SERVICES_JSON não é JSON válido');
              return;
            }
            if (!Array.isArray(services)) {
              core.setFailed('SERVICES_JSON deve ser um JSON array');
              return;
            }

            const byPlatform = { java: [], go: [], python: [], csharp: [] };

            const normalizePlatform = (rawPlatform, rawPath) => {
              const p = (rawPlatform ?? '').toString().trim().toLowerCase();
              if (p) {
                if (p === 'c#' || p === 'csharp' || p === 'c-sharp') return 'csharp';
                return p;
              }
              const path = (rawPath ?? '').toString().trim();
              const parts = path.split('/').filter(Boolean);
              if (parts.length >= 2) {
                const fromPath = parts[1].toLowerCase();
                if (fromPath === 'c#' || fromPath === 'csharp') return 'csharp';
                return fromPath;
              }
              return '';
            };

            const seen = new Set();
            for (const s of services) {
              const path = (s?.path ?? '').toString().trim();
              if (!path) continue;
              if (seen.has(path)) continue;
              seen.add(path);

              const platform = normalizePlatform(s?.platform, path);
              if (platform === 'java') byPlatform.java.push(s);
              else if (platform === 'go') byPlatform.go.push(s);
              else if (platform === 'python') byPlatform.python.push(s);
              else if (platform === 'csharp') byPlatform.csharp.push(s);
              else core.warning(`Plataforma não roteada (ignorada): platform='${platform}' path='${path}'`);
            }

            core.info(`Backend services recebidos: ${seen.size}`);
            core.info(`- java: ${byPlatform.java.length}`);
            core.info(`- go: ${byPlatform.go.length}`);
            core.info(`- python: ${byPlatform.python.length}`);
            core.info(`- csharp: ${byPlatform.csharp.length}`);

            core.setOutput('java_services', JSON.stringify(byPlatform.java));
            core.setOutput('go_services', JSON.stringify(byPlatform.go));
            core.setOutput('python_services', JSON.stringify(byPlatform.python));
            core.setOutput('csharp_services', JSON.stringify(byPlatform.csharp));

  ci_backend_java:
    name: CI Backend Java
    needs: route_backend_platforms
    if: ${{ always() && needs.route_backend_platforms.outputs.java_services != '[]' && needs.route_backend_platforms.outputs.java_services != '' }}
    uses: ./.github/workflows/call-ci-backend-java.yml
    with:
      services: ${{ needs.route_backend_platforms.outputs.java_services }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  ci_backend_go:
    name: CI Backend Go
    needs: route_backend_platforms
    if: ${{ always() && needs.route_backend_platforms.outputs.go_services != '[]' && needs.route_backend_platforms.outputs.go_services != '' }}
    uses: ./.github/workflows/call-ci-backend-go.yml
    with:
      services: ${{ needs.route_backend_platforms.outputs.go_services }}
    # secrets:
    #   DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    #   DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    #   NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    #   SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  ci_backend_python:
    name: CI Backend Python
    needs: route_backend_platforms
    if: ${{ always() && needs.route_backend_platforms.outputs.python_services != '[]' && needs.route_backend_platforms.outputs.python_services != '' }}
    uses: ./.github/workflows/call-ci-backend-python.yml
    with:
      services: ${{ needs.route_backend_platforms.outputs.python_services }}
    # secrets:
    #   DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    #   DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    #   NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    #   SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  ci_backend_csharp:
    name: CI Backend CSharp
    needs: route_backend_platforms
    if: ${{ always() && needs.route_backend_platforms.outputs.csharp_services != '[]' && needs.route_backend_platforms.outputs.csharp_services != '' }}
    uses: ./.github/workflows/call-ci-backend-csharp.yml
    with:
      services: ${{ needs.route_backend_platforms.outputs.csharp_services }}
    # secrets:
    #   DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    #   DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    #   NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    #   SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
