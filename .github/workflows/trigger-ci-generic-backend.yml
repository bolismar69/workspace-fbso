name: CI Generic Backend
run-name: CI Genérico Backend - EVENTO/{{ github.event_name }} - BRANCH/{{ github.ref }} - REPOSITORY/{{ github.repository }} - NUMBER/{{ github.run_number }} - ACTOR/{{ github.actor }}

# FUNÇÃO
# - Pipeline específico para backend.
# - Suporta 2 modos:
#   - push/PR: detecta alterações via reusable detector (git diff) e retorna apenas {path}.
#   - workflow_dispatch/workflow_call: valida apenas o layout de `services` (lista de {path}).
# - Validação/enriquecimento contra o inventory ocorre em job dedicado: validate-identified-solutions.
# - Roteia as solutions por plataforma (stack=backend): java/go/python/csharp.
# - Chama o workflow especialista correspondente:
#   - backend/csharp  -> call-ci-backend-csharp.yml
#   - backend/go      -> call-ci-backend-go.yml
#   - backend/python  -> call-ci-backend-python.yml
#   - backend/java    -> call-ci-backend-java.yml
# - Evolução futura: cada workflow especialista implementa build/test/lint da sua plataforma.
#
# INPUTS
# - workflow_dispatch.services: opcional (JSON array string) no formato [{"path":"..."}] para sobrescrever a detecção automática.
# - workflow_call.services: opcional (JSON array string) no formato [{"path":"..."}] para sobrescrever a detecção automática.
#
# OUTPUTS
# - Nenhum. Efeito: chama workflows especialistas conforme plataformas afetadas.

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
  workflow_dispatch:
    inputs:
      services:
        description: 'Opcional: JSON array (formato oficial) para sobrescrever a detecção automática.'
        required: false
        type: string
        default: '[{"path": "backend/java/spring/queue_workers/ms-transaction-processor-queue"},{"path": "backend/csharp/.net/queue_workers/ms-transaction-processor-queue"},{"path": "backend/go/gin/queue_workers/ms-transaction-processor-queue"},{"path": "backend/python/django/queue_workers/ms-transaction-processor-queue"},{"path": "frontend/javascript/react/web_apps/web-ecommerce-sales"},{"path": "orchestration/kestra/flows/etl/etl-bank-files-process"}]'
  workflow_call:
    inputs:
      services:
        description: 'String contendo JSON array de solutions (somente backend/*).'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-solutions-changed:
    name: Detectar solutions alteradas (backend)
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    uses: ./.github/workflows/util-detection-solutions-changed.yml
    with:
      stack: backend
      base_sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before || github.sha }}
      head_sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

  detect-input-services:
    name: Validar input.services (workflow_dispatch/workflow_call)
    if: >-
      ${{
        (github.event_name == 'workflow_call'
          && inputs.services
          && inputs.services != ''
          && inputs.services != 'null'
          && inputs.services != '[]'
          && contains(inputs.services, '"path"')
        )
        ||
        (github.event_name == 'workflow_dispatch'
          && github.event.inputs.services
          && github.event.inputs.services != ''
          && github.event.inputs.services != 'null'
          && github.event.inputs.services != '[]'
          && contains(github.event.inputs.services, '"path"')
        )
      }}
    uses: ./.github/workflows/util-validate-input-services.yml
    with:
      stack: backend
      services: ${{ github.event_name == 'workflow_call' && inputs.services || github.event.inputs.services }}
      strict: 'false'

  # verificar:
  #   name: Verificar se há solutions a processar
  #   needs: [detect-input-services, detect-solutions-changed]
  #   if: ${{ always() }}
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Diagnóstico
  #       run: |
  #         set -euo pipefail
  #         echo "needs.detect-solutions-changed.result=${{ needs['detect-solutions-changed'].result }}"
  #         echo "needs.detect-solutions-changed.outputs.solutions=${{ fromJSON(toJSON(needs['detect-solutions-changed'].outputs)).solutions }}"
  #         echo "needs.detect-input-services.result=${{ needs['detect-input-services'].result }}"
  #         echo "needs.detect-input-services.outputs.solutions=${{ fromJSON(toJSON(needs['detect-input-services'].outputs)).solutions }}"

  validate-identified-solutions:
    name: Validar solutions identificadas (inventory)
    needs: [detect-solutions-changed, detect-input-services]
    if: >-
      ${{
        always()
        && ( needs['detect-input-services'].result == 'success' || needs['detect-solutions-changed'].result == 'success' )
      }}
    uses: ./.github/workflows/util-validate-identified-solutions.yml
    with:
      stack: backend
      services: >-
        ${{
          (needs['detect-input-services'].result == 'success' && fromJSON(toJSON(needs['detect-input-services'].outputs)).solutions)
          || (needs['detect-solutions-changed'].result == 'success' && fromJSON(toJSON(needs['detect-solutions-changed'].outputs)).solutions)
          || '[]'
        }}

  enrich-missing-specification:
    name: Preencher specification via global types (backend)
    runs-on: ubuntu-latest
    needs: validate-identified-solutions
    if: ${{ always() && needs['validate-identified-solutions'].result == 'success' && fromJSON(toJSON(needs['validate-identified-solutions'].outputs)).solutions != '' && fromJSON(toJSON(needs['validate-identified-solutions'].outputs)).solutions != '[]' }}
    outputs:
      solutions: ${{ steps.enrich.outputs.solutions }}
      paths: ${{ steps.enrich.outputs.paths }}
    steps:
      - name: Diagnóstico (validate-identified-solutions)
        env:
          VALIDATE_RESULT: ${{ needs['validate-identified-solutions'].result }}
          VALIDATE_SOLUTIONS: ${{ fromJSON(toJSON(needs['validate-identified-solutions'].outputs)).solutions }}
          VALIDATE_PATHS: ${{ fromJSON(toJSON(needs['validate-identified-solutions'].outputs)).paths }}
        run: |
          set -euo pipefail
          echo "needs.validate-identified-solutions.result=$VALIDATE_RESULT"
          echo "needs.validate-identified-solutions.outputs.paths=${VALIDATE_PATHS:-}"
          echo "needs.validate-identified-solutions.outputs.solutions=${VALIDATE_SOLUTIONS:-}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ vars.CI_PYTHON_VERSION || '3.11' }}

      - name: Aplicar defaults de specification (por tipo)
        id: enrich
        env:
          SERVICES_JSON: ${{ fromJSON(toJSON(needs['validate-identified-solutions'].outputs)).solutions || '[]' }}
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_global_types_specification.py \
            --global-types architecture/governance/config/global-types-solution.json

  route-backend-platforms:
    name: Roteamento por plataforma (backend)
    runs-on: ubuntu-latest
    needs: enrich-missing-specification
    if: ${{ always() && needs['enrich-missing-specification'].outputs['solutions'] != '' && needs['enrich-missing-specification'].outputs['solutions'] != '[]' }}
    outputs:
      java_services: ${{ steps.route.outputs.java_services }}
      go_services: ${{ steps.route.outputs.go_services }}
      python_services: ${{ steps.route.outputs.python_services }}
      csharp_services: ${{ steps.route.outputs.csharp_services }}
    steps:
      - name: Diagnóstico (enrich-missing-specification)
        env:
          ENRICH_SOLUTIONS: ${{ needs['enrich-missing-specification'].outputs['solutions'] }}
          ENRICH_PATHS: ${{ needs['enrich-missing-specification'].outputs['paths'] }}
        run: |
          set -euo pipefail
          echo "needs.enrich-missing-specification.outputs.paths=${ENRICH_PATHS:-}"
          echo "needs.enrich-missing-specification.outputs.solutions=${ENRICH_SOLUTIONS:-}"
      - name: Roteiar services por plataforma
        id: route
        uses: actions/github-script@v7
        env:
          SERVICES_JSON: ${{ needs['enrich-missing-specification'].outputs['solutions'] || '[]' }}
        with:
          script: |
            let services;
            try {
              services = JSON.parse((process.env.SERVICES_JSON ?? '[]').toString());
            } catch {
              core.setFailed('SERVICES_JSON não é JSON válido');
              return;
            }
            if (!Array.isArray(services)) {
              core.setFailed('SERVICES_JSON deve ser um JSON array');
              return;
            }

            const byPlatform = { java: [], go: [], python: [], csharp: [] };

            const normalizePlatform = (rawPlatform, rawPath) => {
              const p = (rawPlatform ?? '').toString().trim().toLowerCase();
              if (p) {
                if (p === 'c#' || p === 'csharp' || p === 'c-sharp') return 'csharp';
                return p;
              }
              const path = (rawPath ?? '').toString().trim();
              const parts = path.split('/').filter(Boolean);
              if (parts.length >= 2) {
                const fromPath = parts[1].toLowerCase();
                if (fromPath === 'c#' || fromPath === 'csharp') return 'csharp';
                return fromPath;
              }
              return '';
            };

            const seen = new Set();
            for (const s of services) {
              const path = (s?.path ?? '').toString().trim();
              if (!path) continue;
              if (seen.has(path)) continue;
              seen.add(path);

              const platform = normalizePlatform(s?.platform, path);
              if (platform === 'java') byPlatform.java.push(s);
              else if (platform === 'go') byPlatform.go.push(s);
              else if (platform === 'python') byPlatform.python.push(s);
              else if (platform === 'csharp') byPlatform.csharp.push(s);
              else core.warning(`Plataforma não roteada (ignorada): platform='${platform}' path='${path}'`);
            }

            core.info(`Backend services recebidos: ${seen.size}`);
            core.info(`- java: ${byPlatform.java.length}`);
            core.info(`- go: ${byPlatform.go.length}`);
            core.info(`- python: ${byPlatform.python.length}`);
            core.info(`- csharp: ${byPlatform.csharp.length}`);

            core.setOutput('java_services', JSON.stringify(byPlatform.java));
            core.setOutput('go_services', JSON.stringify(byPlatform.go));
            core.setOutput('python_services', JSON.stringify(byPlatform.python));
            core.setOutput('csharp_services', JSON.stringify(byPlatform.csharp));

  ci-backend-java:
    name: CI Backend Java
    needs: route-backend-platforms
    if: ${{ always() && needs['route-backend-platforms'].outputs.java_services != '[]' && needs['route-backend-platforms'].outputs.java_services != '' }}
    uses: ./.github/workflows/call-ci-backend-java.yml
    with:
      services: ${{ needs['route-backend-platforms'].outputs.java_services }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  ci-backend-go:
    name: CI Backend Go
    needs: route-backend-platforms
    if: ${{ always() && needs['route-backend-platforms'].outputs.go_services != '[]' && needs['route-backend-platforms'].outputs.go_services != '' }}
    uses: ./.github/workflows/call-ci-backend-go.yml
    with:
      services: ${{ needs['route-backend-platforms'].outputs.go_services }}

  ci-backend-python:
    name: CI Backend Python
    needs: route-backend-platforms
    if: ${{ always() && needs['route-backend-platforms'].outputs.python_services != '[]' && needs['route-backend-platforms'].outputs.python_services != '' }}
    uses: ./.github/workflows/call-ci-backend-python.yml
    with:
      services: ${{ needs['route-backend-platforms'].outputs.python_services }}

  ci-backend-csharp:
    name: CI Backend CSharp
    needs: route-backend-platforms
    if: ${{ always() && needs['route-backend-platforms'].outputs.csharp_services != '[]' && needs['route-backend-platforms'].outputs.csharp_services != '' }}
    uses: ./.github/workflows/call-ci-backend-csharp.yml
    with:
      services: ${{ needs['route-backend-platforms'].outputs.csharp_services }}
