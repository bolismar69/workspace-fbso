name: Call CI Backend Go

# FUNÇÃO
# - Workflow especialista (backend/go).
# - Neste estágio inicial, apenas valida e imprime o payload recebido.
# - Evolução futura: executar testes/build, lint, empacotamento, docker, etc.
#
# INPUTS (workflow_call)
# - services: JSON array string com solutions (itens do inventory, incluindo specification).
#
# OUTPUTS
# - Nenhum.

on:
  workflow_call:
    inputs:
      services:
        description: 'JSON array string de solutions (somente backend/go/*).'
        required: true
        type: string
    # secrets:
    #   DOCKERHUB_USERNAME:
    #     required: true
    #   DOCKERHUB_TOKEN:
    #     required: true
    #   SONAR_TOKEN:
    #     required: false
    #   NVD_API_KEY:
    #     required: false

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Log services (backend/go)
        uses: actions/github-script@v7
        env:
          SERVICES_JSON: ${{ inputs.services }}
        with:
          script: |
            let services;
            try {
              services = JSON.parse((process.env.SERVICES_JSON ?? '[]').toString());
            } catch {
              core.setFailed('inputs.services não é JSON válido');
              return;
            }
            if (!Array.isArray(services)) {
              core.setFailed('inputs.services deve ser um JSON array');
              return;
            }
            core.info(`Services backend/go recebidos: ${services.length}`);
            for (const s of services) core.info(`- ${s?.path ?? '<sem path>'}`);
