name: Call CI Backend Go

# FUNÇÃO
# - Workflow especialista (backend/go).
# - Neste estágio inicial, apenas valida e imprime o payload recebido.
# - Evolução futura: executar testes/build, lint, empacotamento, docker, etc.
#
# INPUTS (workflow_call)
# - services: JSON array string com solutions (itens do inventory, incluindo specification).
#
# OUTPUTS
# - Nenhum.

on:
  workflow_call:
    inputs:
      services:
        description: 'JSON array string de solutions (somente backend/go/*).'
        required: true
        type: string
    # secrets:
    #   DOCKERHUB_USERNAME:
    #     required: true
    #   DOCKERHUB_TOKEN:
    #     required: true
    #   SONAR_TOKEN:
    #     required: false
    #   NVD_API_KEY:
    #     required: false

permissions:
  contents: read

jobs:
  call-ci-go:
    name: Call CI Backend Go
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.services) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log services (backend/go)
        env:
          SERVICES_JSON: ${{ matrix.path }}
        run: |
          echo "Service backend/go recebido: ${SERVICES_JSON}"
