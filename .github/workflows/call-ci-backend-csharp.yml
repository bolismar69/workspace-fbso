name: Call CI Backend CSharp

# FUNÇÃO
# - Workflow especialista (backend/csharp).
# - Neste estágio inicial, apenas valida e imprime o payload recebido.
# - Evolução futura: dotnet restore/test/build, lint, docker, etc.
#
# INPUTS (workflow_call)
# - services: JSON array string com solutions (itens do inventory, incluindo specification).
#
# OUTPUTS
# - Nenhum.

on:
  workflow_call:
    inputs:
      services:
        description: 'JSON array string de solutions (somente backend/csharp/*).'
        required: true
        type: string

permissions:
  contents: read

jobs:
  csharp:
    runs-on: ubuntu-latest
    steps:
      - name: Log services (backend/csharp)
        uses: actions/github-script@v7
        env:
          SERVICES_JSON: ${{ inputs.services }}
        with:
          script: |
            let services;
            try {
              services = JSON.parse((process.env.SERVICES_JSON ?? '[]').toString());
            } catch {
              core.setFailed('inputs.services não é JSON válido');
              return;
            }
            if (!Array.isArray(services)) {
              core.setFailed('inputs.services deve ser um JSON array');
              return;
            }
            core.info(`Services backend/csharp recebidos: ${services.length}`);
            for (const s of services) core.info(`- ${s?.path ?? '<sem path>'}`);
